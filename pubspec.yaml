name: switchon
description: "스위치온 다이어트를 끝까지 완주하게 돕는 모바일 동반자 앱."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend (auth + Postgres + storage)
  supabase_flutter: ^2.5.6

  # Local-first state / persistence
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2

  # 로컬 알림 (단식/셰이크/물/취침 리마인더)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # 식단 사진
  image_picker: ^1.1.2

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
