# Netlify 빌드 설정 — Flutter Web 을 클라우드에서 빌드해 정적 파일로 배포.
[build]
  command = "bash netlify_build.sh"
  publish = "build/web"

[build.environment]
  # 빌드 중 내려받는 Flutter SDK 내부에 구글 API 키 패턴이 들어있어
  # 비밀값 검사가 오탐함 → 도구 폴더는 검사 제외.
  SECRETS_SCAN_OMIT_PATHS = "flutter/**,.dart_tool/**,.idea/**"
  # Supabase anon 키는 클라이언트에 넣도록 설계된 공개용 값(노출 정상).
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL"

# SPA 라우팅: 모든 경로를 index.html 로 (Flutter 라우터가 처리)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 보안 헤더 — SharedArrayBuffer(WASM) 활성화 + 모바일 호환성
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

# HTML 엔트리 — 항상 재검증해 새 배포가 즉시 반영되게 한다(모바일 캐시 방지).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Flutter 엔트리 파일 — 빌드마다 파일명이 고정이므로 immutable 로 캐싱하면
# 새 배포가 사용자에게 반영되지 않는다. 항상 재검증(must-revalidate)하게 한다.
[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 핑거프린트(해시)된 정적 에셋만 장기 캐싱.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "cross-origin"
