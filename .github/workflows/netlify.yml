name: Flutter Web → Netlify

on:
  push:
    branches:
      - claude/switchon-diet-app-brief-14o0ha

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: Flutter Web 빌드
        run: |
          flutter create . --platforms=web
          cp tools/index.html web/index.html
          cp tools/manifest.json web/manifest.json
          flutter build web --release \
            --pwa-strategy=none \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          # 과거에 설치된 Flutter SW 를 제거하는 킬-스위치 SW 배포.
          cp tools/flutter_service_worker.js build/web/flutter_service_worker.js
          # 캐시/보안 헤더 + SPA 리다이렉트 — 직접 배포에서도 반드시 적용되도록
          # 퍼블리시 폴더에 _headers/_redirects 를 함께 배포한다.
          cp tools/_headers build/web/_headers
          cp tools/_redirects build/web/_redirects

      - name: Netlify 배포
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: build/web
          production-branch: claude/switchon-diet-app-brief-14o0ha
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions — ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 99979bc2-c6e2-4d6e-b468-f7e699b99040
